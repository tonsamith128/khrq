name: PHP foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: PHP source lint
        run: php tests/lint.php

      - name: Unit and regression suite
        run: php tests/run.php

      - name: Validate Composer manifests
        run: |
          composer validate --strict --no-check-publish composer.json
          composer validate --strict --no-check-publish packages/core/composer.json
          composer validate --strict --no-check-publish packages/php/composer.json
          composer validate --strict --no-check-publish packages/laravel/composer.json

      - name: Composer autoload smoke
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          php tests/run.php
          php examples/plain-php/generate.php
