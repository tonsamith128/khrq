name: PHP foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: PHP source lint
        run: php tests/lint.php

      - name: Unit and regression suite
        run: |
          php tests/run.php
          php tests/bakong-http.php
          php tests/read-only-acceptance.php
          php tests/bank-qr-preflight.php
          php tests/bank-issued-order-review.php
          php tools/bakong-connection-check.php --dry-run
          php -r 'if (preg_match("/\\bcurl_close\\s*\\(\\s*\\$/", file_get_contents("packages/bakong/src/Http/CurlHttpClient.php"))) { fwrite(STDERR, "Deprecated curl_close invocation detected.\\n"); exit(1); } echo "CURL_LIFECYCLE=PHP_8_COMPATIBLE\\n";'

      - name: Local OpenCV offline QR fallback smoke (synthetic-only)
        if: matrix.php == '8.5'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-opencv python3-qrcode python3-pil
          /usr/bin/python3 tests/opencv-qr-fallback.py

      - name: Validate Composer manifests
        run: |
          composer validate --strict --no-check-publish composer.json
          composer validate --strict --no-check-publish packages/core/composer.json
          composer validate --strict --no-check-publish packages/bakong/composer.json
          composer validate --strict --no-check-publish packages/php/composer.json
          composer validate --strict --no-check-publish packages/laravel/composer.json

      - name: Composer autoload smoke
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          php tests/run.php
          php tests/bakong-http.php
          php tests/read-only-acceptance.php
          php tests/bank-qr-preflight.php
          php tests/bank-issued-order-review.php
          php examples/plain-php/generate.php

  laravel-ledger:
    name: Laravel SQLite ledger acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP and SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
      - name: Install development autoloading
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install test-only Illuminate dependencies
        run: |
          mkdir -p /tmp/khqr-illuminate
          printf '%s\n' '{"name":"tonsamith/khqr-test-deps","require":{"php":"^8.3","illuminate/database":"^12.0","illuminate/support":"^12.0"},"minimum-stability":"stable"}' > /tmp/khqr-illuminate/composer.json
          composer install --working-dir=/tmp/khqr-illuminate --no-interaction --no-progress --prefer-dist
      - name: Run Laravel ledger acceptance
        env:
          KHQR_LARAVEL_VENDOR: /tmp/khqr-illuminate/vendor
        run: |
          php tests/laravel-store.php
          php tests/laravel-lifecycle.php

  mysql-ledger:
    name: MySQL 8 ledger acceptance
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_only_not_production
          MYSQL_DATABASE: khqr_test
          MYSQL_USER: khqr_test
          MYSQL_PASSWORD: test_ledger_only_not_production
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_root_only_not_production"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP for isolated MySQL tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none
      - name: Install project autoloading
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install test-only database components
        run: |
          mkdir -p /tmp/khqr-illuminate
          printf '%s\n' '{"name":"tonsamith/khqr-test-mysql","require":{"php":"^8.3","illuminate/database":"^12.0","illuminate/support":"^12.0"},"minimum-stability":"stable"}' > /tmp/khqr-illuminate/composer.json
          composer install --working-dir=/tmp/khqr-illuminate --no-interaction --no-progress --prefer-dist
      - name: Isolated MySQL concurrency and settlement acceptance
        env:
          KHQR_ACCEPT_ISOLATED_TEST_DB: 'YES'
          KHQR_LARAVEL_VENDOR: /tmp/khqr-illuminate/vendor
          KHQR_TEST_MYSQL_HOST: 127.0.0.1
          KHQR_TEST_MYSQL_PORT: '3306'
          KHQR_TEST_MYSQL_DATABASE: khqr_test
          KHQR_TEST_MYSQL_USER: khqr_test
          KHQR_TEST_MYSQL_PASSWORD: test_ledger_only_not_production
        run: php tests/mysql-ledger.php

